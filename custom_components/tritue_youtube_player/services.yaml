play_on_players:
  name: Play on selected media players
  description: Resolve YouTube, public Zing or direct HTTP audio and play it on one or more media players.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID of the TriTue player server used as the source.
      required: true
      example: 01J00000000000000000000000
      selector:
        config_entry:
          integration: tritue_youtube_player
    source:
      name: Source
      description: Metadata and playback provider for the selected result.
      required: true
      example: youtube
      selector:
        select:
          options:
            - youtube
            - zing
            - facebook
            - http
    target:
      name: Media target
      description: YouTube video ID or URL, or a public Zing song URL returned by search.
      required: true
      example: dQw4w9WgXcQ
      selector:
        text:
    media_content_type:
      name: HTTP media type
      description: Optional MIME type for a direct HTTP audio URL, such as audio/flac.
      required: false
      example: audio/mpeg
      selector:
        text:
    entity_id:
      name: Speakers and displays
      description: One or more physical media_player entities that will receive the media.
      required: true
      selector:
        entity:
          domain: media_player
          multiple: true
    volume_level:
      name: Volume
      description: Optional volume applied to all selected players before playback.
      required: false
      example: 0.35
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: slider
    mode:
      name: Playback mode
      description: "'audio' = sound only (even on a TV). 'video' = let a TV/box open the YouTube app (picture quality is chosen by the app on the device, not by this integration). Only applies to the YouTube source; ignored for zing/facebook/http. Leave empty to keep the default per device."
      required: false
      selector:
        select:
          options:
            - audio
            - video
    session_id:
      required: false
      selector:
        text:
    join:
      required: false
      default: false
      selector:
        boolean:
    playlist_id:
      required: false
      selector:
        text:
play_playlist:
  name: Play playlist by code
  description: Play a saved playlist by library ID on one or more media players.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID of the TriTue player server.
      required: true
      selector:
        config_entry:
          integration: tritue_youtube_player
    playlist_code:
      name: Playlist code
      description: 12-character library playlist ID (e.g. abcdef012345). Share codes must be imported into library first.
      required: true
      example: abcdef012345
      selector:
        text:
    entity_id:
      name: Speakers and displays
      description: Physical media players that receive the playlist.
      required: true
      selector:
        entity:
          domain: media_player
          multiple: true
    volume_level:
      name: Volume
      description: Optional volume applied before playback.
      required: false
      example: 0.35
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: slider
    mode:
      name: Playback mode
      description: "'audio' = sound only (even on a TV). 'video' = let a TV/box open the YouTube app (picture quality is chosen by the app on the device, not by this integration). Only applies to the YouTube source; ignored for zing/facebook/http. Leave empty to keep the default per device."
      required: false
      selector:
        select:
          options:
            - audio
            - video
play_queue:
  name: Play queue by code
  description: Play a saved queue by key code directly on media players.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID of the TriTue player server.
      required: true
      selector:
        config_entry:
          integration: tritue_youtube_player
    queue_code:
      name: Queue code
      description: Queue key code copied from the card (e.g. media_player.living_room).
      required: true
      example: media_player.living_room
      selector:
        text:
    entity_id:
      name: Speakers and displays
      description: Physical media players that receive the queue.
      required: true
      selector:
        entity:
          domain: media_player
          multiple: true
    volume_level:
      name: Volume
      description: Optional volume applied before playback.
      required: false
      example: 0.35
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: slider
    mode:
      name: Playback mode
      description: "'audio' = sound only (even on a TV). 'video' = let a TV/box open the YouTube app (picture quality is chosen by the app on the device, not by this integration). Only applies to the YouTube source; ignored for zing/facebook/http. Leave empty to keep the default per device."
      required: false
      selector:
        select:
          options:
            - audio
            - video
skip:
  fields:
    entry_id:
      required: true
      selector:
        text:
    session_id:
      required: false
      selector:
        text:
    step:
      required: false
      default: 1
      selector:
        number:
          min: -1
          max: 1
          step: 2
stop_session:
  fields:
    entry_id:
      required: true
      selector:
        text:
    session_id:
      required: false
      selector:
        text:
remove_players:
  fields:
    entry_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
          multiple: true
