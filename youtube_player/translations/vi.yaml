configuration:
  app_title:
    name: Tên hiển thị
    description: Tên xuất hiện trên đầu giao diện trình phát.
  max_history:
    name: Số mục lịch sử
    description: Số video hoặc playlist được lưu gần đây, từ 1 đến 100.
  max_extract:
    name: Số lần trích xuất cùng lúc
    description: Tối đa bao nhiêu lần yt-dlp/tìm kiếm chạy đồng thời (1–8, mặc định 2). Nhỏ hơn thì đỡ tốn RAM/CPU, lớn hơn thì nhiều loa bấm cùng lúc đỡ chờ.
  integration_token:
    name: Token tích hợp
    description: Bearer token tùy chọn cho custom integration. Để trống để tự sinh và lưu trong /data.
  public_base_url:
    name: URL phát trong mạng LAN
    description: Để trống là được — add-on tự lấy địa chỉ LAN của máy chạy Home Assistant. Chỉ điền dạng http://IP:8099 khi bạn đã đổi cổng ở tab Mạng, hoặc khi loa không ra tiếng.
network:
  8099/TCP: Loa tải luồng phát qua cổng này; để nguyên 8099 là chạy được ngay.
