configuration:
  app_title:
    name: Display title
    description: The title shown at the top of the player interface.
  max_history:
    name: History size
    description: Number of recent videos or playlists to retain, from 1 to 100.
  integration_token:
    name: Integration token
    description: Optional bearer token for the Home Assistant integration. Leave empty to generate one in /data.
  public_base_url:
    name: LAN playback URL
    description: Leave empty — the add-on detects the Home Assistant host's LAN address itself. Set http://IP:8099 only if you changed the port on the Network tab, or if speakers stay silent.
network:
  8099/TCP: Speakers fetch the audio stream over this port; leaving it at 8099 works out of the box.
